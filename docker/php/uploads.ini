; アップロードのサイズ上限。
;
; 画像の上限 2MB は「アプリのバリデーション（Laravel の max:2048 = 2MiB）で判定する」
; 方針のため、PHP 側には余裕を持たせる。PHP がここで弾くと Laravel には
; UPLOAD_ERR_INI_SIZE の壊れたアップロードとして届き、仕様どおりのエラー
; （422 + errors）を返せなくなる（docs/07「アップロードサイズの境界」）。
;
; 前段の nginx が client_max_body_size 5m で切るため、実質この値には到達しない。
; 「nginx < PHP」の順序を保つことで、nginx を通ったリクエストは必ず Laravel が判定する。
upload_max_filesize = 5M
post_max_size = 6M
