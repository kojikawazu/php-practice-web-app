; session の Upload Progress 機能を無効化する（既定は On）。
;
; 3 アプリとも使っていない機能だが、On のままだと multipart リクエストを受けた PHP 本体が
; アプリのコードより前に session を触る。CVE-2026-109619（php2shell）はこの経路での RCE が
; 実証されており、Laravel / Laminas 側の対策では防げない（docs/06「PHP 本体の脆弱性」）。
; 修正版（8.3.36）で直っても、使わない攻撃面を開けておく理由は無いため恒久的に閉じる。
;
; ini_set() や .user.ini ではリクエスト解析に間に合わないため、conf.d で設定する。
; 効いていることは scripts/setup.sh が php-fpm -i で 3 サービスとも検証する。
session.upload_progress.enabled = 0
