# laminas -> host 8003
server {
    listen 82;
    server_name _;
    root /var/www/laminas/public;
    index index.php;

    # laminas はアップロード機能を持たないため、既定の 1m のままにする
    # （不要に大きな body を受け付けない）。

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass php-laminas:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
