# laravel-fullstack -> host 8001
server {
    listen 80;
    server_name _;
    root /var/www/laravel-fullstack/public;
    index index.php;

    # 画像の上限はアプリ側（Laravel の max:2048 = 2MiB）で判定する方針のため、
    # multipart のオーバーヘッド込みでそれを上回る値にする。既定の 1m のままだと
    # 2MB 以下の正当な画像が nginx の 413 で弾かれ、Laravel の 422 に到達しない。
    # ここを通ったリクエストは必ず PHP へ届く（PHP 側は 5M / 6M でさらに緩い）。
    client_max_body_size 5m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php-fs:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}

# laravel-api -> host 8002
