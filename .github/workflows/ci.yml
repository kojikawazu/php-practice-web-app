name: CI

on:
  push:
    branches: [main]
  pull_request:

# dorny/paths-filter は pull_request 時に変更ファイルを GitHub API で取得するため
# pull-requests: read が必要。最小権限を明示する（contents: read は checkout 用）。
permissions:
  contents: read
  pull-requests: read

# 同一 PR に連続 push した際、古い実行をキャンセルして CI 時間を無駄にしない。
# （デプロイ workflow を追加する際は cancel-in-progress: false にする。中断で不整合が起きるため）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 差分パスを 1 か所で判定する軽量ジョブ。
  #
  # 判定は .claude/rules/github-actions.md に従い「除外リスト」で書く。
  # 対象リスト（'apps/**' 等の列挙）にすると、新しいトップレベルディレクトリが増えたときに
  # 黙ってテストが走らなくなる（fail-open）ため、「ドキュメント以外はコード変更とみなす」と
  # 反転させて安全側に倒す。
  #
  # dorny/paths-filter はパターンごとに picomatch を評価し、既定では結果を OR（some）で束ねる。
  # そのため否定パターンだけを並べても互いを打ち消して常に true になってしまう。
  # predicate-quantifier: every で AND 評価にすることで「どの除外にも当たらない = コード変更」
  # という意味になる。肯定形の docs フィルタは every だと壊れるので、別ステップに分けている。
  # test / lint / e2e はそれぞれ読むファイルが違うため、発火条件も分ける。
  # 各ツールの実際の対象範囲（設定ファイルで確認済み）:
  #   Larastan = apps/laravel-*/app のみ（phpstan.neon の paths）
  #   Pint     = プロジェクト全体（pint.json なし = 既定。tests/ database/ routes/ も整形対象）
  #   Psalm    = module + config + public/index.php（module/*/test を含む）
  #   phpcs    = config + module + public/index.php（php / dist / phtml）
  #   PHPUnit  = 各アプリの phpunit.xml / phpunit.xml.dist
  # → lint は静的解析の設定に依存し phpunit.xml には依存しない。test はその逆。
  # → どちらも e2e/** / docker/** / compose.yaml / Makefile に依存しない
  #    （test は setup-php で動き Docker を使わない。CI は Makefile を経由しない）。
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.code.outputs.test }}
      lint: ${{ steps.code.outputs.lint }}
      e2e: ${{ steps.code.outputs.e2e }}
      docs: ${{ steps.docs.outputs.docs }}
      workflows: ${{ steps.workflows.outputs.workflows }}
      deps: ${{ steps.deps.outputs.deps }}
    steps:
      - uses: actions/checkout@v7

      # 除外リスト（AND 評価）。条件を狭める方向の変更なので under-fire（必要な検査が
      # 走らない）が最大のリスク。除外して良いのは「そのジョブが読まないと確認できた
      # ファイル」だけに限る。どの除外にも当たらない変更は必ず発火する（安全側）。
      - uses: dorny/paths-filter@v4
        id: code
        with:
          predicate-quantifier: every
          filters: |
            test:
              - '!docs/**'
              - '!**/*.md'
              - '!.claude/**'
              # markdown lint の設定のみに影響するファイル（下の docs フィルタ側で拾う）
              - '!.markdownlint-cli2.jsonc'
              # 入れ子の markdown lint 設定（.github/PULL_REQUEST_TEMPLATE/ 等）も同じ扱い
              - '!**/.markdownlint.jsonc'
              # ルート直下の package*.json は markdown lint 専用（PHPUnit は読まない）
              - '!package.json'
              - '!package-lock.json'
              # PHPUnit は compose / Playwright / Makefile を使わない
              # （pcov は setup-php が入れるため、docker/php/Dockerfile への追加も CI には影響しない）
              - '!e2e/**'
              - '!docker/**'
              - '!compose.yaml'
              - '!Makefile'
              # scripts/** は除外しない。test ジョブが scripts/coverage-threshold.php を
              # 実行するため、ここを除外すると下限を変更しても検証されないまま通る。
              # 静的解析のみに影響する設定（lint 側で拾う）
              - '!**/phpstan.neon'
              - '!**/phpstan-baseline.neon'
              - '!**/psalm.xml'
              - '!**/psalm-baseline.xml'
              - '!**/phpcs.xml'
            lint:
              - '!docs/**'
              - '!**/*.md'
              - '!.claude/**'
              - '!.markdownlint-cli2.jsonc'
              # 入れ子の markdown lint 設定（.github/PULL_REQUEST_TEMPLATE/ 等）も同じ扱い
              - '!**/.markdownlint.jsonc'
              # ルート直下の package*.json は markdown lint 専用（Pint / phpcs / Psalm / Larastan は読まない）
              - '!package.json'
              - '!package-lock.json'
              # Pint / phpcs / Psalm / Larastan は compose / Playwright / Makefile を読まない
              - '!e2e/**'
              - '!docker/**'
              - '!compose.yaml'
              - '!Makefile'
              # テスト実行のみに影響する設定（test 側で拾う）
              - '!**/phpunit.xml'
              - '!**/phpunit.xml.dist'
            e2e:
              - '!docs/**'
              - '!**/*.md'
              - '!.claude/**'
              - '!.markdownlint-cli2.jsonc'
              # 入れ子の markdown lint 設定（.github/PULL_REQUEST_TEMPLATE/ 等）も同じ扱い
              - '!**/.markdownlint.jsonc'
              # ルート直下の package*.json は markdown lint 専用（Playwright が読むのは e2e/package*.json）
              - '!package.json'
              - '!package-lock.json'
              # ユニット/IT のテストコードだけの変更で重い compose 起動をしない
              - '!apps/*/tests/**'
              - '!apps/laminas/module/*/test/**'
              # 静的解析・PHPUnit の設定は E2E の挙動に影響しない
              - '!**/phpstan.neon'
              - '!**/phpstan-baseline.neon'
              - '!**/psalm.xml'
              - '!**/psalm-baseline.xml'
              - '!**/phpcs.xml'
              - '!**/phpunit.xml'
              - '!**/phpunit.xml.dist'
              # CI の e2e ジョブは compose を直接叩く（Makefile を使わない）
              - '!Makefile'

      # 肯定リスト（既定の OR 評価）: md が 1 つでも変わったら markdown lint を実行する。
      - uses: dorny/paths-filter@v4
        id: docs
        with:
          filters: |
            docs:
              - '**/*.md'
              - '.markdownlint-cli2.jsonc'
              - '**/.markdownlint.jsonc'
              # markdownlint-cli2 のバージョン更新（Dependabot の PR）でも検査を走らせる
              - 'package.json'
              - 'package-lock.json'

      # 肯定リスト: actionlint は workflow ファイルだけを読むため、対象を明示して絞る。
      # （除外リストにしないのは、検査対象が .github/workflows/** で閉じており
      #   「未知のファイルが増えたら発火させる」必要がないため。fail-open にならない）
      - uses: dorny/paths-filter@v4
        id: workflows
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
              # actionlint のコマンド定義（イメージのタグを含む）。CI がこれを呼ぶため、
              # 変更したら検査対象に含める。
              - 'Makefile'
              # actionlint の設定ファイル（現在は未設置。追加された時点で拾う）
              - '.github/actionlint.yaml'

      # 肯定リスト: 依存の脆弱性監査は「依存が変わったとき」だけ走らせる。
      # .claude/rules/coding-standards.md / security.md の「依存を更新したら composer audit を
      # 実行し、クリーンを維持する」を機械化したもので、対象は 3 アプリの composer マニフェスト。
      #
      # 全 PR で走らせない理由: composer audit は「新しいアドバイザリが公開された」だけでも
      # 落ちるようになるため、依存を 1 行も触っていない PR が無関係な理由でブロックされる。
      # 依存を触らないまま公開される新規アドバイザリの検出は Dependabot alerts が担う
      # （リポジトリ設定で有効化済み。docs/06 の「依存の脆弱性」を参照）。役割を分けている。
      - uses: dorny/paths-filter@v4
        id: deps
        with:
          filters: |
            deps:
              - 'apps/*/composer.json'
              - 'apps/*/composer.lock'

      # 除外リストの土台である AND 評価（predicate-quantifier: every）が、実際に AND として
      # 効いていることを自己検証する。
      #
      # dorny/paths-filter は既定でパターンの結果を OR（some）で束ねるため、every が効かないと
      # 否定パターンは互いを打ち消し、除外が 1 つも効かなくなる（docs/lessons-learned.md
      # 2026-07-25）。しかもその壊れ方は「全部 true になる」＝**必要なジョブは走り続ける**ため、
      # CI は緑のままで誰も気づけない。Dependabot が paths-filter のメジャー更新を PR で
      # 上げるようになった以上（.github/dependabot.yml）、緑を根拠にできない。
      #
      # 判定は「同時には満たせない 2 条件」で行う。AND なら false、OR なら true になる。
      # 対照として単独の '**' も置き、変更ファイルが 0 件で検証が空振りするのを検出する
      # （.claude/rules/testing.md「ガード自体をテストする」）。
      - uses: dorny/paths-filter@v4
        id: quantifier
        with:
          predicate-quantifier: every
          filters: |
            contradiction:
              - '**'
              - '!**'
            control:
              - '**'

      - name: Verify predicate-quantifier is AND
        env:
          CONTRADICTION: ${{ steps.quantifier.outputs.contradiction }}
          CONTROL: ${{ steps.quantifier.outputs.control }}
        run: |
          if [ "$CONTROL" != "true" ]; then
            echo "::error::変更ファイルを 1 件も検出できず、AND 評価を検証できませんでした。検査できなかったことを合格として扱いません。"
            exit 1
          fi
          if [ "$CONTRADICTION" != "false" ]; then
            echo "::error::predicate-quantifier: every が AND として評価されていません（'**' と '!**' が同時に真になっています）。除外リストが無効化され、docs だけの変更でも test / lint / e2e が走る状態です。dorny/paths-filter の更新を差し戻してください。"
            exit 1
          fi
          echo "self-test OK: AND 評価が有効（contradiction=false / control=true）"

  # 秘匿ファイルが Git の追跡対象に入った時点で落とすガード。
  #
  # .gitignore は「混入させない」側の対策でしかない。未追跡ファイルにしか効かないため、
  # 一度追跡されたファイルや git add -f、新規ディレクトリでの書き漏れは止められない。
  # そして Git の履歴は追記型なので、push 済みの秘匿ファイルは追跡除外しても履歴に残り、
  # 対処は鍵・トークンのローテーションしかない（不可逆）。だから検出側を CI に置く。
  #
  # git ls-files はインデックスを読むだけで、履歴もワーキングツリーも走査しない。
  # 混入はどの変更種別でも起こりうるため、changes ジョブに依存させず常に実行する
  # （needs: を持たないのは意図。ドキュメントだけの PR でも走る）。
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    # 追跡ファイルの「パス名」を読むだけ。シークレットを渡さず最小権限に絞る
    # （ワークフローレベルの pull-requests: read は changes ジョブ用で、ここでは不要）。
    permissions:
      contents: read
    env:
      # 検出対象: .env 系・秘密鍵・証明書・サービスアカウント鍵。
      SECRET_PATTERN: '(^|/)(\.env(\..+)?|[^/]+\.(key|pem|p12|pfx|jks|keystore)|id_rsa|id_ed25519|id_dsa|credentials\.json|serviceAccountKey\.json)$'
      # 除外対象: 雛形（*.example 等）と型定義（.env.d.ts）。中身を持たないため誤検知になる。
      ALLOW_PATTERN: '\.(example|sample|template|dist)$|\.env\.d\.ts$'
    steps:
      - uses: actions/checkout@v7

      # 自己検証と本走査を 1 ステップに置くのは、判定式を 1 か所にするため
      # （run: ごとにシェルが分かれるので、複数ステップだと式を書き写すことになる）。
      - name: Assert no secret files are tracked
        run: |
          # 追跡パスを stdin で受け、秘匿ファイルとみなすものだけを出力する。
          #
          # ここで grep を使わないのは終了コードの都合。grep は「マッチ 0 件」でも 1 を返し、
          # run: は bash -e で動くため、tracked=$(... | grep ...) と書くと
          # 「1 件も見つからない = 正常」のときにスクリプトごと落ちる（しかも無言で）。
          # awk は出力の有無に関わらず 0 で終わるため、この罠を構造的に避けられる。
          #
          # パターンは -v ではなく ENVIRON 経由で渡す。-v は値のエスケープを再解釈するため
          # \. が . に化け、任意 1 文字にマッチする別物の正規表現になってしまう。
          scan() {
            awk 'BEGIN { s = ENVIRON["SECRET_PATTERN"]; a = ENVIRON["ALLOW_PATTERN"] }
                 $0 ~ s && $0 !~ a'
          }

          # --- 1. ガード自体の検証 ---
          # ガードが壊れると「常に緑」になり、検査が止まったことに誰も気づけない
          # （.claude/rules/testing.md「ガード自体をテストする」）。
          # 本走査の前に、検出すべきパスと素通りすべきパスの分類を突き合わせる。
          must_detect='config/master.key
          .env
          front/.env.local
          base/.env.production
          certs/server.pem
          secrets/id_rsa
          gcp/serviceAccountKey.json
          apps/laravel-fullstack/storage/oauth-private.key'

          must_pass='front/.env.example
          front/.env.local.example
          apps/laravel-api/.env.example
          e2e/.env.example
          src/env.d.ts
          front/.env.d.ts
          docs/keyboard.md
          src/apiKey.ts
          README.md'

          # 複数行文字列の 2 行目以降は YAML のインデントを含むため、落としてから流す。
          detected=$(printf '%s\n' "$must_detect" | sed 's/^ *//' | scan | wc -l | tr -d ' ')
          expected=$(printf '%s\n' "$must_detect" | sed 's/^ *//' | wc -l | tr -d ' ')
          leaked=$(printf '%s\n' "$must_pass" | sed 's/^ *//' | scan)

          if [ "$detected" != "$expected" ] || [ -n "$leaked" ]; then
            echo "::error::secret scan の判定が壊れています。SECRET_PATTERN / ALLOW_PATTERN を確認してください。"
            echo "検出できたはずの件数: $detected / $expected"
            [ -n "$leaked" ] && { echo "誤検知（素通りすべきなのに検出された）:"; echo "$leaked"; }
            exit 1
          fi
          echo "self-test OK: 検出 $detected/$expected 件・誤検知 0 件"

          # --- 2. 本走査 ---
          tracked=$(git ls-files | scan)

          if [ -n "$tracked" ]; then
            echo "::error::秘匿ファイルが Git 管理下にあります。.gitignore への追加や git rm --cached では履歴から消えないため、鍵・トークンのローテーションが必要になります。"
            echo "$tracked"
            exit 1
          fi
          echo "OK: 追跡対象に秘匿ファイルはありません"

  # GitHub Actions ワークフロー自身の静的解析。
  # .claude/rules/github-actions.md が workflow 変更時の actionlint 実行を要求するため、
  # その品質ゲートを CI 上で強制する。構文・式（${{ }}）・runner ラベル・action 入力に加え、
  # run: の中身を shellcheck に流すため、shell の不具合もここで落ちる。
  #
  # 取得は公式 Docker イメージのバージョン固定タグ（shellcheck 同梱）。定義は Makefile が
  # 唯一の正本で、CI もそれを呼ぶため手元と CI で同じ検査結果になる。
  actionlint:
    name: actionlint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    # ワークフローを読むだけ。シークレットを渡さず最小権限に絞る
    # （ワークフローレベルの pull-requests: read は changes ジョブ用で、ここでは不要）。
    permissions:
      contents: read
    steps:
      # actionlint は .git からリポジトリルートを判定するため checkout を先に置く。
      - uses: actions/checkout@v7

      # コマンドとイメージのタグは Makefile 1 箇所で定義し、手元と CI で同一のものを実行する
      # （2 箇所に書き写すと、片方だけ上げても CI は緑のまま検査内容がずれる）。
      - name: Lint workflows (actionlint)
        run: make actionlint

  # ドキュメント（md）変更時の軽量チェック。
  # github-actions.md の「ドキュメント変更でも『何も動かさない』にはしない」に対応する。
  # 設定と無効化理由は .markdownlint-cli2.jsonc に記載（警告ゼロを維持する運用）。
  markdown-lint:
    name: markdown lint
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      # バージョンは package.json の devDependency で完全固定する（npx の版直書きは
      # マニフェストではないため Dependabot から見えず、更新契機が生まれない）。
      - name: Install dev tooling
        run: npm ci

      # 設定ファイル（.markdownlint-cli2.jsonc）の globs / ignores を使うため引数は渡さない。
      - name: Lint markdown
        run: npm run lint:md

  test:
    name: test (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: laravel-fullstack, laravel: true }
          - { app: laravel-api, laravel: true }
          - { app: laminas, laravel: false }

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, pdo_sqlite, dom, xml, curl, zip, fileinfo, tokenizer
          # カバレッジ計測ドライバ。none のままだと PHPUnit は計測を黙ってスキップし、
          # Clover が出力されないまま「テストは緑」になる（下限判定はそれを失敗として扱う）。
          # Xdebug ではなく pcov を使うのは計測専用で速いため（手元の Docker イメージも pcov）。
          coverage: pcov

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          working-directory: apps/${{ matrix.app }}

      # Laravel はテスト起動に APP_KEY が必要（テスト DB は phpunit.xml で sqlite in-memory）
      - name: Prepare Laravel env
        if: ${{ matrix.laravel }}
        working-directory: apps/${{ matrix.app }}
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests (Laravel)
        if: ${{ matrix.laravel }}
        working-directory: apps/${{ matrix.app }}
        run: php artisan test --coverage --coverage-clover=coverage.xml

      - name: Run tests (Laminas)
        if: ${{ !matrix.laravel }}
        working-directory: apps/${{ matrix.app }}
        run: ./vendor/bin/phpunit --coverage-text --only-summary-for-coverage-text --coverage-clover=coverage.xml

      # ガード自体を自己検証する。下限判定が壊れると「常に緑」になり、検査が止まったことに
      # 誰も気づけない（.claude/rules/testing.md）。落ちるべき 2 経路を確認する。
      # if で受けているのは、失敗を期待するコマンドで bash -e に止められないため。
      - name: Verify coverage guard
        run: |
          low='<?xml version="1.0"?><coverage><project><metrics statements="100" coveredstatements="50"/></project></coverage>'
          printf '%s' "$low" > "${RUNNER_TEMP}/low-coverage.xml"
          if php scripts/coverage-threshold.php "${RUNNER_TEMP}/low-coverage.xml"; then
            echo '下限割れを検出できていない（ガードが機能していない）' >&2
            exit 1
          fi
          if php scripts/coverage-threshold.php "${RUNNER_TEMP}/does-not-exist.xml"; then
            echo 'レポート不在を検出できていない（計測の停止を見逃す）' >&2
            exit 1
          fi

      # 下限の判定は scripts/coverage-threshold.php に集約している（下限値の正本はそのファイル）。
      # 手元の `make coverage` も同じスクリプトを呼ぶため、基準が 2 箇所に分かれない。
      # レポートが無い場合も失敗させる（計測が壊れた日に「ずっと緑」になるのを防ぐ）。
      - name: Check coverage threshold
        working-directory: apps/${{ matrix.app }}
        run: php ../../scripts/coverage-threshold.php coverage.xml

  # 静的チェック（整形・コーディング標準・型解析）。lint フィルタが true のときのみ実行する。
  # test とは発火条件を分けており、静的解析の設定（phpstan.neon / psalm.xml / phpcs.xml /
  # baseline）だけを変えた場合は lint のみ、phpunit.xml だけを変えた場合は test のみが走る。
  # Laravel: Pint（整形の差分検査）+ Larastan／ Laminas: phpcs（コーディング標準）+ Psalm（baseline 運用）。
  lint:
    name: lint (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: laravel-fullstack, laravel: true }
          - { app: laravel-api, laravel: true }
          - { app: laminas, laravel: false }

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, pdo_sqlite, dom, xml, curl, zip, fileinfo, tokenizer
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          working-directory: apps/${{ matrix.app }}

      # Laravel: Pint の差分検査（整形崩れがあれば失敗。修正は `vendor/bin/pint`）
      - name: Format check (Pint)
        if: ${{ matrix.laravel }}
        working-directory: apps/${{ matrix.app }}
        run: ./vendor/bin/pint --test

      # Laravel: 静的型解析（Larastan/PHPStan level max）。既存の指摘は phpstan-baseline.neon に
      # 記録済みで、新規に増えた指摘のみ CI を失敗させる（Laminas の Psalm baseline と同じ運用）。
      - name: Static analysis (Larastan)
        if: ${{ matrix.laravel }}
        working-directory: apps/${{ matrix.app }}
        run: composer analyse

      # Laminas: コーディング標準（修正は `composer cs-fix`）
      - name: Coding standard (phpcs)
        if: ${{ !matrix.laravel }}
        working-directory: apps/laminas
        run: composer cs-check

      # Laminas: 静的型解析（既存の指摘は psalm-baseline.xml に記録済み。新規の指摘のみ失敗）
      - name: Static analysis (Psalm)
        if: ${{ !matrix.laravel }}
        working-directory: apps/laminas
        run: ./vendor/bin/psalm --no-progress

      # 依存の脆弱性監査。deps == 'true'（composer マニフェストが変わった PR）でのみ実行する。
      #
      # --abandoned=ignore を付けるのは、abandoned（開発終了）パッケージがあるだけで
      # composer audit が終了コード 1 を返すため。本リポジトリの laminas には既に 4 件あり
      # （laminas-config / laminas-json / laminas-loader / package-versions-deprecated）、
      # 付けないと「脆弱性 0 件でも常に赤」になってゲートとして機能しない。
      # abandoned は脆弱性ではなく別の問題なので、ここでは扱わない。
      - name: Dependency audit (composer audit)
        if: needs.changes.outputs.deps == 'true'
        working-directory: apps/${{ matrix.app }}
        run: composer audit --abandoned=ignore

  # E2E（Playwright）。compose で app + 実 MySQL を起動し、3 アプリ横断のブラウザ/HTTP フローを検証する。
  # test/lint（SQLite・軽量）とは別ジョブに分離し、compose 起動を伴う重い処理を切り離す。
  # e2e フィルタ（apps/** / e2e/** / compose.yaml / docker/** の変更）が true のときのみ実行。
  e2e:
    name: e2e (playwright)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 初期化手順の正本は scripts/setup.sh（ローカルの `make setup` と同じもの）。
      # .env 作成・compose 起動・MySQL 待ち・3 アプリの composer install・書き込み権限・
      # APP_KEY・マイグレーション・疎通確認までを含む。CI 側へ手順を複製すると、
      # 片方だけ直されて fresh clone が起動できない状態に戻るため 1 か所へ寄せる。
      - name: Set up stack (scripts/setup.sh)
        run: ./scripts/setup.sh

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -n 300
