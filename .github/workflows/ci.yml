name: CI

on:
  push:
    branches: [main]
  pull_request:

# dorny/paths-filter は pull_request 時に変更ファイルを GitHub API で取得するため
# pull-requests: read が必要。最小権限を明示する（contents: read は checkout 用）。
permissions:
  contents: read
  pull-requests: read

jobs:
  # 差分パスを 1 か所で判定する軽量ジョブ。
  # code が変わっていない（= doc-only）なら、重い test ジョブをスキップする。
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - '.github/workflows/**'
            e2e:
              - 'apps/**'
              - 'e2e/**'
              - 'compose.yaml'
              - 'docker/**'
              - '.github/workflows/**'

  test:
    name: test (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: laravel-fullstack, laravel: true }
          - { app: laravel-api, laravel: true }
          - { app: laminas, laravel: false }

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, pdo_sqlite, dom, xml, curl, zip, fileinfo, tokenizer
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: apps/${{ matrix.app }}

      # Laravel はテスト起動に APP_KEY が必要（テスト DB は phpunit.xml で sqlite in-memory）
      - name: Prepare Laravel env
        if: ${{ matrix.laravel }}
        working-directory: apps/${{ matrix.app }}
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests (Laravel)
        if: ${{ matrix.laravel }}
        working-directory: apps/${{ matrix.app }}
        run: php artisan test

      - name: Run tests (Laminas)
        if: ${{ !matrix.laravel }}
        working-directory: apps/${{ matrix.app }}
        run: ./vendor/bin/phpunit

  # 静的チェック（整形・コーディング標準・型解析）。test と同じく code 変更時のみ実行する。
  # Laravel: Pint（整形の差分検査）／ Laminas: phpcs（コーディング標準）+ Psalm（型解析・baseline 運用）。
  lint:
    name: lint (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: laravel-fullstack, laravel: true }
          - { app: laravel-api, laravel: true }
          - { app: laminas, laravel: false }

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, pdo_sqlite, dom, xml, curl, zip, fileinfo, tokenizer
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: apps/${{ matrix.app }}

      # Laravel: Pint の差分検査（整形崩れがあれば失敗。修正は `vendor/bin/pint`）
      - name: Format check (Pint)
        if: ${{ matrix.laravel }}
        working-directory: apps/${{ matrix.app }}
        run: ./vendor/bin/pint --test

      # Laminas: コーディング標準（修正は `composer cs-fix`）
      - name: Coding standard (phpcs)
        if: ${{ !matrix.laravel }}
        working-directory: apps/laminas
        run: composer cs-check

      # Laminas: 静的型解析（既存の指摘は psalm-baseline.xml に記録済み。新規の指摘のみ失敗）
      - name: Static analysis (Psalm)
        if: ${{ !matrix.laravel }}
        working-directory: apps/laminas
        run: ./vendor/bin/psalm --no-progress

  # E2E（Playwright）。compose で app + 実 MySQL を起動し、3 アプリ横断のブラウザ/HTTP フローを検証する。
  # test/lint（SQLite・軽量）とは別ジョブに分離し、compose 起動を伴う重い処理を切り離す。
  # e2e フィルタ（apps/** / e2e/** / compose.yaml / docker/** の変更）が true のときのみ実行。
  e2e:
    name: e2e (playwright)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env
        run: cp .env.example .env

      - name: Start stack (docker compose)
        run: docker compose up -d --build

      - name: Wait for MySQL healthy
        run: |
          for i in $(seq 1 60); do
            if docker compose ps mysql | grep -q healthy; then
              echo "mysql healthy"; exit 0
            fi
            sleep 3
          done
          echo "mysql did not become healthy"; docker compose ps; exit 1

      - name: Migrate (Laravel ×2)
        run: |
          docker compose exec -T php-fs php artisan migrate --force
          docker compose exec -T php-api php artisan migrate --force

      - name: Wait for apps to respond
        run: |
          for url in http://localhost:8001/login http://localhost:8002/api/tasks http://localhost:8003/login; do
            ok=""
            for i in $(seq 1 40); do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || true)
              if [ "$code" != "000" ] && [ -n "$code" ]; then
                echo "$url -> $code"; ok="1"; break
              fi
              sleep 3
            done
            if [ -z "$ok" ]; then echo "no response from $url"; exit 1; fi
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -n 300
