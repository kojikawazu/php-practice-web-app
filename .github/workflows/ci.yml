name: CI

on:
  push:
    branches: [main]
  pull_request:

# dorny/paths-filter は pull_request 時に変更ファイルを GitHub API で取得するため
# pull-requests: read が必要。最小権限を明示する（contents: read は checkout 用）。
permissions:
  contents: read
  pull-requests: read

# 同一 PR に連続 push した際、古い実行をキャンセルして CI 時間を無駄にしない。
# （デプロイ workflow を追加する際は cancel-in-progress: false にする。中断で不整合が起きるため）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 差分パスを 1 か所で判定する軽量ジョブ。
  #
  # 判定は .claude/rules/github-actions.md に従い「除外リスト」で書く。
  # 対象リスト（'apps/**' 等の列挙）にすると、新しいトップレベルディレクトリが増えたときに
  # 黙ってテストが走らなくなる（fail-open）ため、「ドキュメント以外はコード変更とみなす」と
  # 反転させて安全側に倒す。
  #
  # dorny/paths-filter はパターンごとに picomatch を評価し、既定では結果を OR（some）で束ねる。
  # そのため否定パターンだけを並べても互いを打ち消して常に true になってしまう。
  # predicate-quantifier: every で AND 評価にすることで「どの除外にも当たらない = コード変更」
  # という意味になる。肯定形の docs フィルタは every だと壊れるので、別ステップに分けている。
  # test / lint / e2e はそれぞれ読むファイルが違うため、発火条件も分ける。
  # 各ツールの実際の対象範囲（設定ファイルで確認済み）:
  #   Larastan = apps/laravel-*/app のみ（phpstan.neon の paths）
  #   Pint     = プロジェクト全体（pint.json なし = 既定。tests/ database/ routes/ も整形対象）
  #   Psalm    = module + config + public/index.php（module/*/test を含む）
  #   phpcs    = config + module + public/index.php（php / dist / phtml）
  #   PHPUnit  = 各アプリの phpunit.xml / phpunit.xml.dist
  # → lint は静的解析の設定に依存し phpunit.xml には依存しない。test はその逆。
  # → どちらも e2e/** / docker/** / compose.yaml / Makefile に依存しない
  #    （test は setup-php で動き Docker を使わない。CI は Makefile を経由しない）。
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.code.outputs.test }}
      lint: ${{ steps.code.outputs.lint }}
      e2e: ${{ steps.code.outputs.e2e }}
      docs: ${{ steps.docs.outputs.docs }}
    steps:
      - uses: actions/checkout@v4

      # 除外リスト（AND 評価）。条件を狭める方向の変更なので under-fire（必要な検査が
      # 走らない）が最大のリスク。除外して良いのは「そのジョブが読まないと確認できた
      # ファイル」だけに限る。どの除外にも当たらない変更は必ず発火する（安全側）。
      - uses: dorny/paths-filter@v3
        id: code
        with:
          predicate-quantifier: every
          filters: |
            test:
              - '!docs/**'
              - '!**/*.md'
              - '!.claude/**'
              # markdown lint の設定のみに影響するファイル（下の docs フィルタ側で拾う）
              - '!.markdownlint-cli2.jsonc'
              # PHPUnit は compose / Playwright / Makefile を使わない
              - '!e2e/**'
              - '!docker/**'
              - '!compose.yaml'
              - '!Makefile'
              # 静的解析のみに影響する設定（lint 側で拾う）
              - '!**/phpstan.neon'
              - '!**/phpstan-baseline.neon'
              - '!**/psalm.xml'
              - '!**/psalm-baseline.xml'
              - '!**/phpcs.xml'
            lint:
              - '!docs/**'
              - '!**/*.md'
              - '!.claude/**'
              - '!.markdownlint-cli2.jsonc'
              # Pint / phpcs / Psalm / Larastan は compose / Playwright / Makefile を読まない
              - '!e2e/**'
              - '!docker/**'
              - '!compose.yaml'
              - '!Makefile'
              # テスト実行のみに影響する設定（test 側で拾う）
              - '!**/phpunit.xml'
              - '!**/phpunit.xml.dist'
            e2e:
              - '!docs/**'
              - '!**/*.md'
              - '!.claude/**'
              - '!.markdownlint-cli2.jsonc'
              # ユニット/IT のテストコードだけの変更で重い compose 起動をしない
              - '!apps/*/tests/**'
              - '!apps/laminas/module/*/test/**'
              # 静的解析・PHPUnit の設定は E2E の挙動に影響しない
              - '!**/phpstan.neon'
              - '!**/phpstan-baseline.neon'
              - '!**/psalm.xml'
              - '!**/psalm-baseline.xml'
              - '!**/phpcs.xml'
              - '!**/phpunit.xml'
              - '!**/phpunit.xml.dist'
              # CI の e2e ジョブは compose を直接叩く（Makefile を使わない）
              - '!Makefile'

      # 肯定リスト（既定の OR 評価）: md が 1 つでも変わったら markdown lint を実行する。
      - uses: dorny/paths-filter@v3
        id: docs
        with:
          filters: |
            docs:
              - '**/*.md'
              - '.markdownlint-cli2.jsonc'

  # ドキュメント（md）変更時の軽量チェック。
  # github-actions.md の「ドキュメント変更でも『何も動かさない』にはしない」に対応する。
  # 設定と無効化理由は .markdownlint-cli2.jsonc に記載（警告ゼロを維持する運用）。
  markdown-lint:
    name: markdown lint
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 設定ファイル（.markdownlint-cli2.jsonc）の globs / ignores を使うため引数は渡さない。
      - name: Lint markdown
        run: npx --yes markdownlint-cli2@0.18.1

  test:
    name: test (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.test == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: laravel-fullstack, laravel: true }
          - { app: laravel-api, laravel: true }
          - { app: laminas, laravel: false }

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, pdo_sqlite, dom, xml, curl, zip, fileinfo, tokenizer
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: apps/${{ matrix.app }}

      # Laravel はテスト起動に APP_KEY が必要（テスト DB は phpunit.xml で sqlite in-memory）
      - name: Prepare Laravel env
        if: ${{ matrix.laravel }}
        working-directory: apps/${{ matrix.app }}
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests (Laravel)
        if: ${{ matrix.laravel }}
        working-directory: apps/${{ matrix.app }}
        run: php artisan test

      - name: Run tests (Laminas)
        if: ${{ !matrix.laravel }}
        working-directory: apps/${{ matrix.app }}
        run: ./vendor/bin/phpunit

  # 静的チェック（整形・コーディング標準・型解析）。lint フィルタが true のときのみ実行する。
  # test とは発火条件を分けており、静的解析の設定（phpstan.neon / psalm.xml / phpcs.xml /
  # baseline）だけを変えた場合は lint のみ、phpunit.xml だけを変えた場合は test のみが走る。
  # Laravel: Pint（整形の差分検査）+ Larastan／ Laminas: phpcs（コーディング標準）+ Psalm（baseline 運用）。
  lint:
    name: lint (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: laravel-fullstack, laravel: true }
          - { app: laravel-api, laravel: true }
          - { app: laminas, laravel: false }

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, pdo_sqlite, dom, xml, curl, zip, fileinfo, tokenizer
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: apps/${{ matrix.app }}

      # Laravel: Pint の差分検査（整形崩れがあれば失敗。修正は `vendor/bin/pint`）
      - name: Format check (Pint)
        if: ${{ matrix.laravel }}
        working-directory: apps/${{ matrix.app }}
        run: ./vendor/bin/pint --test

      # Laravel: 静的型解析（Larastan/PHPStan level max）。既存の指摘は phpstan-baseline.neon に
      # 記録済みで、新規に増えた指摘のみ CI を失敗させる（Laminas の Psalm baseline と同じ運用）。
      - name: Static analysis (Larastan)
        if: ${{ matrix.laravel }}
        working-directory: apps/${{ matrix.app }}
        run: composer analyse

      # Laminas: コーディング標準（修正は `composer cs-fix`）
      - name: Coding standard (phpcs)
        if: ${{ !matrix.laravel }}
        working-directory: apps/laminas
        run: composer cs-check

      # Laminas: 静的型解析（既存の指摘は psalm-baseline.xml に記録済み。新規の指摘のみ失敗）
      - name: Static analysis (Psalm)
        if: ${{ !matrix.laravel }}
        working-directory: apps/laminas
        run: ./vendor/bin/psalm --no-progress

  # E2E（Playwright）。compose で app + 実 MySQL を起動し、3 アプリ横断のブラウザ/HTTP フローを検証する。
  # test/lint（SQLite・軽量）とは別ジョブに分離し、compose 起動を伴う重い処理を切り離す。
  # e2e フィルタ（apps/** / e2e/** / compose.yaml / docker/** の変更）が true のときのみ実行。
  e2e:
    name: e2e (playwright)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env
        run: cp .env.example .env

      - name: Start stack (docker compose)
        run: docker compose up -d --build

      - name: Wait for MySQL healthy
        run: |
          for i in $(seq 1 60); do
            if docker compose ps mysql | grep -q healthy; then
              echo "mysql healthy"; exit 0
            fi
            sleep 3
          done
          echo "mysql did not become healthy"; docker compose ps; exit 1

      # compose のバインドマウントがビルド時の vendor を隠すため、各コンテナで composer install する。
      # （ローカルは開発中に導入済みの vendor が使われるが、CI のチェックアウトには存在しない）
      - name: Prepare Laravel env (fs / api)
        run: |
          docker compose exec -T php-fs sh -c "cp -n .env.example .env || true"
          docker compose exec -T php-api sh -c "cp -n .env.example .env || true"

      - name: Install PHP dependencies (3 apps)
        run: |
          docker compose exec -T php-fs composer install --no-interaction --prefer-dist --no-progress
          docker compose exec -T php-api composer install --no-interaction --prefer-dist --no-progress
          docker compose exec -T php-laminas composer install --no-interaction --prefer-dist --no-progress

      # php-fpm は www-data で動くが、CI のチェックアウトは runner UID 所有のためフレームワークの
      # 書き込み先（Laravel=storage/bootstrap-cache のビュー compile、laminas=data/cache の設定キャッシュ）に
      # 書けず 500 になる。macOS の bind mount は寛容だが Linux は厳格なため CI でのみ顕在化する。
      - name: Make framework write dirs writable (php-fpm=www-data)
        run: |
          docker compose exec -T --user root php-fs sh -c "mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache bootstrap/cache && chmod -R 777 storage bootstrap/cache"
          docker compose exec -T --user root php-api sh -c "mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache bootstrap/cache && chmod -R 777 storage bootstrap/cache"
          docker compose exec -T --user root php-laminas sh -c "mkdir -p data/cache && chmod -R 777 data"

      - name: Generate Laravel app key (fs / api)
        run: |
          docker compose exec -T php-fs php artisan key:generate --force
          docker compose exec -T php-api php artisan key:generate --force

      - name: Migrate (Laravel ×2)
        run: |
          docker compose exec -T php-fs php artisan migrate --force
          docker compose exec -T php-api php artisan migrate --force

      # 200/302/401 を「正常起動」とみなす。500 等が続く場合はここで早期に失敗させ、
      # 30秒×リトライでテストが長時間ハングするのを防ぐ（api は Accept で 401 を期待）。
      - name: Wait for apps to respond
        run: |
          check() {
            url="$1"; shift; last=""
            for i in $(seq 1 40); do
              code=$(curl -s -o /dev/null -w "%{http_code}" "$@" "$url" || true)
              last="$code"
              case "$code" in
                200|302|401) echo "$url -> $code"; return 0 ;;
              esac
              sleep 3
            done
            echo "app not healthy: $url (last status: $last)"; return 1
          }
          check http://localhost:8001/login
          check http://localhost:8003/login
          check http://localhost:8002/api/tasks -H "Accept: application/json"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -n 300
