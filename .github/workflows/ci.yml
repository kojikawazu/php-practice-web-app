name: CI

on:
  push:
    branches: [main]
  pull_request:

# dorny/paths-filter は pull_request 時に変更ファイルを GitHub API で取得するため
# pull-requests: read が必要。最小権限を明示する（contents: read は checkout 用）。
permissions:
  contents: read
  pull-requests: read

jobs:
  # 差分パスを 1 か所で判定する軽量ジョブ。
  # code が変わっていない（= doc-only）なら、重い test ジョブをスキップする。
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - '.github/workflows/**'

  test:
    name: test (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: laravel-fullstack, laravel: true }
          - { app: laravel-api, laravel: true }
          - { app: laminas, laravel: false }

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, pdo_sqlite, dom, xml, curl, zip, fileinfo, tokenizer
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: apps/${{ matrix.app }}

      # Laravel はテスト起動に APP_KEY が必要（テスト DB は phpunit.xml で sqlite in-memory）
      - name: Prepare Laravel env
        if: ${{ matrix.laravel }}
        working-directory: apps/${{ matrix.app }}
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests (Laravel)
        if: ${{ matrix.laravel }}
        working-directory: apps/${{ matrix.app }}
        run: php artisan test

      - name: Run tests (Laminas)
        if: ${{ !matrix.laravel }}
        working-directory: apps/${{ matrix.app }}
        run: ./vendor/bin/phpunit
