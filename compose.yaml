services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-php_practice}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  php-fs:
    build: ./docker/php
    working_dir: /var/www/laravel-fullstack
    environment:
      UPLOADS_ROOT: /var/www/uploads
    volumes:
      - ./apps/laravel-fullstack:/var/www/laravel-fullstack
      - task-uploads:/var/www/uploads
    depends_on:
      mysql:
        condition: service_healthy

  php-api:
    build: ./docker/php
    working_dir: /var/www/laravel-api
    environment:
      UPLOADS_ROOT: /var/www/uploads
    volumes:
      - ./apps/laravel-api:/var/www/laravel-api
      - task-uploads:/var/www/uploads
    depends_on:
      mysql:
        condition: service_healthy

  php-laminas:
    build: ./docker/php
    working_dir: /var/www/laminas
    volumes:
      - ./apps/laminas:/var/www/laminas
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8001:80"   # laravel-fullstack
      - "8002:81"   # laravel-api
      - "8003:82"   # laminas
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/laravel-fullstack:/var/www/laravel-fullstack:ro
      - ./apps/laravel-api:/var/www/laravel-api:ro
      - ./apps/laminas:/var/www/laminas:ro
    depends_on:
      - php-fs
      - php-api
      - php-laminas

volumes:
  mysql-data:
  task-uploads:
